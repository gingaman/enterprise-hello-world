[build-system]
requires = ["hatchling>=1.24.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[project]
name = "helloworld"
version = "2.0.0-rc.3"
description = "Cloud-native, horizontally scalable greeting orchestration platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "HelloWorld Platform Team", email = "platform@example.com"},
]
keywords = [
    "hello-world",
    "cloud-native",
    "kubernetes",
    "observability",
    "microservices",
    "enterprise",
    "scalable",
    "greetings-as-a-service",
    "salutations",
    "platform-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # Runtime dependencies are listed for roadmap alignment. The v2.0
    # implementation uses the Python standard library exclusively; the
    # dependencies below are reserved for the v2.1 observability uplift
    # and the v2.2 distributed plugin mesh.
    #
    # "pydantic>=2.5",
    # "structlog>=24.1",
    # "prometheus-client>=0.20",
    # "opentelemetry-api>=1.25",
    # "opentelemetry-sdk>=1.25",
    # "opentelemetry-exporter-otlp>=1.25",
    # "httpx>=0.27",
    # "redis>=5.0",
    # "celery>=5.3",
    # "sqlalchemy>=2.0",
    # "alembic>=1.13",
    # "kafka-python>=2.0",
    # "grpcio>=1.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.3",
    "black>=24.0",
]

[project.entry-points."helloworld.plugins"]
default = "helloworld.plugins:DefaultGreeter"
shouting = "helloworld.plugins:ShoutingGreeter"

[project.scripts]
helloworld = "helloworld.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["helloworld"]
