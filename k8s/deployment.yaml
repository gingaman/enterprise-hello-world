# =============================================================================
#  HelloWorld™ — Kubernetes manifests
#  Environment: production
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: greetings
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: helloworld-config
  namespace: greetings
data:
  locale: "en-GB"
  log_level: "INFO"
  enable_telemetry: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helloworld
  namespace: greetings
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloworld
  namespace: greetings
  labels:
    app.kubernetes.io/name: helloworld
    app.kubernetes.io/component: greeter
    app.kubernetes.io/version: "2.0.0-rc.3"
    app.kubernetes.io/managed-by: helm
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: helloworld
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helloworld
        app.kubernetes.io/component: greeter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: helloworld
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: helloworld
          image: registry.example.com/helloworld:2.0.0-rc.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            - name: HELLOWORLD_ENABLE_HEALTH
              value: "true"
            - name: HELLOWORLD_ENABLE_METRICS
              value: "true"
            - name: HELLOWORLD_LOCALE
              valueFrom:
                configMapKeyRef:
                  name: helloworld-config
                  key: locale
            - name: HELLOWORLD_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: helloworld-config
                  key: log_level
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: helloworld
  namespace: greetings
  labels:
    app.kubernetes.io/name: helloworld
spec:
  selector:
    app.kubernetes.io/name: helloworld
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: helloworld
  namespace: greetings
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: helloworld
  minReplicas: 3
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: helloworld_greetings_per_second
        target:
          type: AverageValue
          averageValue: "1000"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: helloworld
  namespace: greetings
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: helloworld
